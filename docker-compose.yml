version: '3.8'


services:
  db:
    image:postgres:15
  environment:
    POSTGRES_USER: user
    POSTGRES_PASSWORD: POSTGRES_PASSWORD
    POSTGRES_DB: qadb
  volumes:
    - postgres_data: /var/lib/postgres/data


  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://user:POSTGRES_PASSWORD@db:5432/qadb
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
 postgres_data






